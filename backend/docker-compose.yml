version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: recruiter_postgres
    environment:
      POSTGRES_DB: recruiter_platform
      POSTGRES_USER: recruiter_user
      POSTGRES_PASSWORD: recruiter_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - recruiter_network
    restart: unless-stopped

  # Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: recruiter_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - recruiter_network
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: recruiter_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - recruiter_network
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruiter_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://recruiter_user:recruiter_password@postgres:5432/recruiter_platform
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=your-secret-key-here
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql://recruiter_user:recruiter_password@postgres:5432/recruiter_platform
    depends_on:
      - postgres
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - recruiter_network
    restart: unless-stopped

  # Airflow Webserver
  airflow-webserver:
    image: apache/airflow:2.8.0
    container_name: recruiter_airflow_webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql://recruiter_user:recruiter_password@postgres:5432/recruiter_platform
      - AIRFLOW__CORE__FERNET_KEY=your-fernet-key-here
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=your-webserver-secret-key
    ports:
      - "8080:8080"
    volumes:
      - ./etl/dags:/opt/airflow/dags
      - ./etl/config/airflow.cfg:/opt/airflow/airflow.cfg
      - airflow_logs:/opt/airflow/logs
    depends_on:
      - postgres
      - redis
    networks:
      - recruiter_network
    restart: unless-stopped
    command: webserver

  # Airflow Scheduler
  airflow-scheduler:
    image: apache/airflow:2.8.0
    container_name: recruiter_airflow_scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql://recruiter_user:recruiter_password@postgres:5432/recruiter_platform
      - AIRFLOW__CORE__FERNET_KEY=your-fernet-key-here
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./etl/dags:/opt/airflow/dags
      - ./etl/config/airflow.cfg:/opt/airflow/airflow.cfg
      - airflow_logs:/opt/airflow/logs
    depends_on:
      - postgres
      - redis
    networks:
      - recruiter_network
    restart: unless-stopped
    command: scheduler

  # Airflow Worker (for CeleryExecutor)
  airflow-worker:
    image: apache/airflow:2.8.0
    container_name: recruiter_airflow_worker
    environment:
      - AIRFLOW__CORE__EXECUTOR=CeleryExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql://recruiter_user:recruiter_password@postgres:5432/recruiter_platform
      - AIRFLOW__CORE__FERNET_KEY=your-fernet-key-here
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/dags
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CELERY__BROKER_URL=redis://redis:6379/0
      - AIRFLOW__CELERY__RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./etl/dags:/opt/airflow/dags
      - ./etl/config/airflow.cfg:/opt/airflow/airflow.cfg
      - airflow_logs:/opt/airflow/logs
    depends_on:
      - postgres
      - redis
    networks:
      - recruiter_network
    restart: unless-stopped
    command: celery worker

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: recruiter_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
      - airflow-webserver
    networks:
      - recruiter_network
    restart: unless-stopped

  # Elasticsearch for search and analytics
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: recruiter_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - recruiter_network
    restart: unless-stopped

  # Kibana for Elasticsearch visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: recruiter_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - recruiter_network
    restart: unless-stopped

  # MinIO for object storage (file uploads, resumes, etc.)
  minio:
    image: minio/minio:latest
    container_name: recruiter_minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - recruiter_network
    restart: unless-stopped
    command: server /data --console-address ":9001"

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: recruiter_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - recruiter_network
    restart: unless-stopped

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: recruiter_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - recruiter_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  airflow_logs:
  elasticsearch_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  recruiter_network:
    driver: bridge
