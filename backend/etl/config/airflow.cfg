[core]
# The home folder for airflow, default is ~/airflow
airflow_home = /opt/airflow

# The folder where your airflow pipelines live, most likely a
# subfolder in a code repository
dags_folder = /opt/airflow/dags

# The folder where airflow should store its log files
base_log_folder = /opt/airflow/logs

# The executor class that airflow should use. Options include:
# SequentialExecutor, LocalExecutor, CeleryExecutor, KubernetesExecutor
executor = LocalExecutor

# The SqlAlchemy connection string to the metadata database.
# The connection string for PostgreSQL
sql_alchemy_conn = postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

# The maximum number of tasks that can be run in parallel
parallelism = 32

# The number of task instances allowed to run concurrently
dag_concurrency = 16

# Are DAGs paused by default at creation
dags_are_paused_at_creation = True

# When not using pools, tasks are run in the "default pool",
# whose size is determined by this config option
non_pooled_task_slot_count = 128

# The maximum number of active DAG runs per DAG
max_active_runs_per_dag = 16

# Whether to load the examples that ship with Airflow.
load_examples = False

# Where to store the pid file
pid_file = /opt/airflow/airflow.pid

# The amount of time (in secs) to wait before killing processes
worker_prestashop_timeout = 30

[logging]
# The folder where airflow should store its log files
base_log_folder = /opt/airflow/logs

# The folder where airflow should store its failed task log files
base_log_folder = /opt/airflow/logs

# Log level for airflow
log_level = INFO

# Logging format
log_format = [%%(asctime)s] {%%(filename)s:%%(lineno)d} %%(levelname)s - %%(message)s

# Simple log format
simple_log_format = %%(asctime)s %%(levelname)s - %%(message)s

[database]
# The SqlAlchemy connection string to the metadata database.
sql_alchemy_conn = postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

# The encoding for the database
sql_engine_encoding = utf-8

# Max overflow size of the connection pool
sql_alchemy_pool_size = 5

# The pool size when using sqlite
sql_alchemy_pool_size = 0

# The maximum db connection that can be open in parallel
sql_alchemy_max_overflow = 10

[api]
# Rest API configuration
auth_backend = airflow.api.auth.backend.basic_auth

[security]
# Set this to a random string
secret_key = your-secret-key-here

[webserver]
# The base url of your website as airflow cannot guess it correctly
base_url = http://localhost:8080

# The ip on which your webserver will listen to traffic
web_server_host = 0.0.0.0

# The port on which your webserver will listen to traffic
web_server_port = 8080

# Number of workers to run the gunicorn web server
workers = 4

# Number of seconds the gunicorn webserver waits before killing a worker
worker_timeout = 120

# The secret key to use for web server
secret_key = your-secret-key-here

[celery]
# Celery configuration
celery_app_name = airflow.executors.celery_executor
broker_url = redis://redis:6379/0
result_backend = redis://redis:6379/0

[scheduler]
# How often (in seconds) to scan the dags folder for new files
dag_dir_list_interval = 300

# How often (in seconds) to check for orphaned tasks
orphaned_tasks_check_interval = 300

# How often (in seconds) to check for zombie tasks
zombie_task_threshold = 300

[redis]
# Redis configuration
redis_port = 6379
redis_db = 0

[elasticsearch]
# Elasticsearch configuration
elasticsearch_host = elasticsearch
elasticsearch_port = 9200
elasticsearch_log_id_template = airflow

[metrics]
# Metrics configuration
statsd_host = localhost
statsd_port = 8125
statsd_prefix = airflow
